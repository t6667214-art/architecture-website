
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Series / Photo Archive</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7f6f2;
      color: #242420;
      font-family: Arial, "Noto Sans JP", sans-serif;
    }
    header {
      margin: 0 5%;
      padding: 28px 0;
      border-bottom: 1px solid #d9d8d1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    a { color: inherit; text-decoration: none; }
    .logo { font-size: 13px; letter-spacing: .12em; }
    main { margin: 54px 5%; }
    .eyebrow {
      font-size: 11px;
      color: #777;
      letter-spacing: .12em;
    }
    h1 { font-size: 30px; font-weight: 400; margin: 14px 0; }
    .description { font-size: 13px; line-height: 1.8; color: #666; }
    .series-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 40px 18px;
      margin-top: 42px;
    }
    .series-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1.5;
      object-fit: cover;
      background: #eeede8;
    }
    .series-number {
      margin-top: 12px;
      font-size: 11px;
      color: #888;
    }
    .series-title { margin-top: 8px; font-size: 15px; }
    .series-description {
      margin-top: 8px;
      color: #777;
      font-size: 12px;
      line-height: 1.7;
    }
    footer {
      margin: 70px 5% 0;
      padding: 24px 0;
      border-top: 1px solid #d9d8d1;
      font-size: 11px;
      letter-spacing: .08em;
    }
    @media (max-width: 650px) {
      .series-grid { grid-template-columns: 1fr; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="./index.html">ARCHITECTURE / PHOTO</a>
    <a href="./index.html">BACK TO ARCHIVE ↗</a>
  </header>

  <main>
    <div class="eyebrow">SERIES ARCHIVE</div>
    <h1>写真のシリーズ</h1>
    <p class="description">
      写真をテーマごとに編集し、複数の視点から読み直すためのシリーズ一覧。
    </p>
    <div class="series-grid" id="series-grid"></div>
  </main>

  <footer>ARCHITECTURE / PHOTO ARCHIVE</footer>

  <script>
    fetch('./series.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('series.json を読み込めませんでした');
        }
        return response.json();
      })
      .then(data => {
        const grid = document.getElementById('series-grid');

        data.series.forEach(series => {
          const card = document.createElement('article');
          card.className = 'series-card';

          const link = document.createElement('a');
          link.href = './series.html?id=' + encodeURIComponent(series.id);

          const img = document.createElement('img');
          img.src = series.photos[0]?.image || '';
          img.alt = series.title;

          const number = document.createElement('div');
          number.className = 'series-number';
          number.textContent = series.id;

          const title = document.createElement('div');
          title.className = 'series-title';
          title.textContent = series.title;

          const description = document.createElement('div');
          description.className = 'series-description';
          description.textContent = series.description.replace(/\\n/g, ' ');

          link.appendChild(img);
          link.appendChild(number);
          link.appendChild(title);
          link.appendChild(description);
          card.appendChild(link);
          grid.appendChild(card);
        });
      })
      .catch(error => console.error(error));
  </script>
</body>
</html>
