
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Series / Photo Archive</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7f6f2;
      color: #242420;
      font-family: Arial, "Noto Sans JP", sans-serif;
    }
    header {
      margin: 0 5%;
      padding: 28px 0;
      border-bottom: 1px solid #d9d8d1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    a { color: inherit; text-decoration: none; }
    .logo { font-size: 13px; letter-spacing: .12em; }
    .back { font-size: 12px; color: #777; }
    main { margin: 54px 5%; }
    .eyebrow {
      font-size: 11px;
      color: #777;
      letter-spacing: .12em;
    }
    h1 { font-size: 30px; font-weight: 400; margin: 14px 0; }
    .description {
      font-size: 13px;
      line-height: 2;
      color: #666;
      margin-bottom: 42px;
    }
    .series-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 36px 18px;
    }
    .series-card img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      object-fit: cover;
    }
    .series-number {
      margin-top: 12px;
      font-size: 11px;
      color: #777;
    }
    .series-title { margin-top: 5px; font-size: 15px; }
    .series-note {
      margin-top: 7px;
      font-size: 12px;
      color: #777;
      line-height: 1.8;
    }
    footer {
      margin: 70px 5% 0;
      padding: 24px 0;
      border-top: 1px solid #d9d8d1;
      font-size: 11px;
      letter-spacing: .08em;
    }
    @media (max-width: 650px) {
      .series-grid { grid-template-columns: 1fr; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="./index.html">PHOTO ARCHIVE</a>
    <a class="back" href="./index.html">BACK TO ARCHIVE ↗</a>
  </header>

  <main>
    <div class="eyebrow">SELECTED SERIES / 01</div>
    <h1>建築のまわりの写真</h1>
    <p class="description">
      建築によって生まれる、見る位置や視点場を記録する。<br>
      ひとつの主題を、複数の写真から読み直すためのシリーズ。
    </p>

    <div class="series-grid" id="series-grid"></div>
  </main>

  <footer>ARCHITECTURE / PHOTO ARCHIVE</footer>
</body>
  <script>
fetch('./series.json')
  .then(response => {
    if (!response.ok) {
      throw new Error('series.json を読み込めませんでした');
    }
    return response.json();
  })
  .then(data => {
    const series = data.series[0];
    const grid = document.getElementById('series-grid');

    document.querySelector('main .eyebrow').textContent =
      'SELECTED SERIES / ' + series.id;
    document.querySelector('main h1').textContent = series.title;
    document.querySelector('main .description').innerHTML =
      series.description.replace(/\n/g, '<br>');

    series.photos.forEach(photo => {
      const card = document.createElement('article');
      card.className = 'series-card';

      const img = document.createElement('img');
      img.src = photo.image;
      img.alt = photo.title;

      const number = document.createElement('div');
      number.className = 'series-number';
      number.textContent = photo.number;

      const title = document.createElement('div');
      title.className = 'series-title';
      title.textContent = photo.title;

      const note = document.createElement('div');
      note.className = 'series-note';
      note.textContent = photo.note;

      card.append(img, number, title, note);
      grid.appendChild(card);
    });
  })
  .catch(error => console.error(error));
</script>
</html>
